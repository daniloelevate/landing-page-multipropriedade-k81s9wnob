server {
    listen 80;
    server_name multipropriedade.saesadvogada.com.br usucapiao.saesadvogada.com.br;
    root /var/www/landing-pages-saes/dist;
    index index.html;

    # Suporte a rotas da SPA: se o arquivo ou pasta física não existir, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
